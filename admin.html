<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danygama Games - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: #141a27;
      padding: 25px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
    }

    h2 {
      margin-top: 10px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 9px;
      border: 1px solid #303a4e;
      font-size: 15px;
    }

    input {
      background: #20283a;
      color: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      background: #7658ff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #444;
    }

    .delete {
      background: #d62828;
    }

    .approve {
      background: #16a34a;
    }

    .refresh {
      background: #2563eb;
    }

    .reject {
      background: #b91c1c;
    }

    .game {
      background: #20283a;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
    }

    .game img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    #panel {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    hr {
      border: 0;
      border-top: 1px solid #303a4e;
      margin: 25px 0;
    }

    .link-title {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    /* COIN ORDER */

    .coin-order {
      background: #20283a;
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #303a4e;
    }

    .coin-order.pending {
      border-left: 5px solid #f59e0b;
    }

    .coin-order.approved {
      border-left: 5px solid #16a34a;
    }

    .coin-order.rejected {
      border-left: 5px solid #d62828;
    }

    .coin-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .coin-row {
      margin: 7px 0;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      background: #555;
    }

    .status.pending {
      background: #f59e0b;
      color: #111;
    }

    .status.approved {
      background: #16a34a;
    }

    .status.rejected {
      background: #d62828;
    }

    .small {
      font-size: 12px;
      color: #aeb7c7;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>🎮 DANYGAMA GAMES</h1>


  <!-- LOGIN -->

  <div id="login">

    <h2>🔐 Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <p id="loginMessage" class="message"></p>

  </div>


  <!-- ADMIN PANEL -->

  <div id="panel">

    <h2>👑 Admin Panel</h2>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>


    <!-- ========================= -->
    <!-- COIN ORDERS -->
    <!-- ========================= -->

    <hr>

    <h2>🪙 Coin Orders</h2>

    <p class="small">
      Hapa utaona malipo ya coins ambayo wateja wametuma.
      Baada ya kuthibitisha malipo, bonyeza APPROVE.
    </p>

    <button
      class="refresh"
      onclick="loadCoinOrders()">
      🔄 REFRESH ORDERS
    </button>

    <p id="coinMessage" class="message"></p>

    <div id="coinOrders">
      ⏳ Inapakia coin orders...
    </div>


    <!-- ========================= -->
    <!-- ADD GAME -->
    <!-- ========================= -->

    <hr>

    <h2>➕ Add New Game</h2>

    <input
      id="name"
      type="text"
      placeholder="Game name"
    >

    <input
      id="platform"
      type="text"
      placeholder="Platform mfano Android"
    >

    <input
      id="size"
      type="text"
      placeholder="Size mfano 2 GB"
    >

    <input
      id="category"
      type="text"
      placeholder="Category mfano Football"
    >

    <label>
      🖼️ Chagua picha ya game:
    </label>

    <input
      id="imageFile"
      type="file"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img id="preview">


    <!-- DOWNLOAD LINKS -->

    <label class="link-title">
      🔗 Download Link 1
    </label>

    <input
      id="download_url_1"
      type="url"
      placeholder="Weka Download Link 1"
    >


    <label class="link-title">
      🔗 Download Link 2
    </label>

    <input
      id="download_url_2"
      type="url"
      placeholder="Weka Download Link 2"
    >


    <label class="link-title">
      🔗 Download Link 3
    </label>

    <input
      id="download_url_3"
      type="url"
      placeholder="Weka Download Link 3"
    >


    <button onclick="addGame()">
      💾 SAVE GAME
    </button>

    <p id="message" class="message"></p>


    <!-- GAMES -->

    <hr>

    <h2>🎮 Games Zilizopo</h2>

    <div id="games">
      Inapakia games...
    </div>

  </div>

</div>


<script>

/* ========================================= */
/* SUPABASE */
/* ========================================= */

const SUPABASE_URL =
  "https://octyeeoameulsdlaaqbc.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jdHllZW9hbWV1bHNkbGFhcWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDE3MzQsImV4cCI6MjEwMzYxNzczNH0.fctDZE-PaC0SPOmygd_6sDEGqaLguNlWXx757MHTPAI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================= */
/* LOGIN */
/* ========================================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "⚠️ Weka email na password.";

    return;
  }

  message.textContent =
    "⏳ Inaingia...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;
  }


  message.textContent =
    "✅ Login successful!";


  showPanel();

}


/* ========================================= */
/* SHOW PANEL */
/* ========================================= */

function showPanel() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("panel").style.display =
    "block";


  loadGames();

  loadCoinOrders();

}


/* ========================================= */
/* LOGOUT */
/* ========================================= */

async function logout() {

  await supabaseClient.auth.signOut();


  document.getElementById("panel").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";

}


/* ========================================= */
/* COIN ORDERS */
/* ========================================= */

async function loadCoinOrders() {

  const container =
    document.getElementById("coinOrders");

  const message =
    document.getElementById("coinMessage");


  if (!container) {
    return;
  }


  container.innerHTML =
    "⏳ Inasoma coin orders...";

  message.textContent = "";


  const { data, error } =
    await supabaseClient
      .from("coin_orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    container.innerHTML =
      "❌ " + escapeHTML(error.message);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "📭 Hakuna coin orders bado.";

    return;
  }


  container.innerHTML = "";


  data.forEach(function(order) {

    const div =
      document.createElement("div");

    div.className =
      "coin-order " +
      (order.status || "pending");


    let statusClass =
      order.status || "pending";


    let statusText =
      order.status === "approved"
        ? "✅ APPROVED"
        : order.status === "rejected"
        ? "❌ REJECTED"
        : "⏳ PENDING";


    let approveButton = "";


    if (order.status === "pending") {

      approveButton = `

        <button
          class="approve"
          onclick="approveCoinOrder('${escapeAttribute(order.id)}')">

          ✅ APPROVE ${escapeHTML(
            String(order.package_coins || "")
          )} COINS

        </button>

      `;

    }


    div.innerHTML = `

      <div class="coin-title">
        🪙 COIN ORDER
      </div>


      <div class="coin-row">
        👤 <strong>User ID:</strong><br>
        ${escapeHTML(order.user_id || "")}
      </div>


      <div class="coin-row">
        🪙 <strong>Coins:</strong>
        ${escapeHTML(
          String(order.package_coins || "")
        )}
      </div>


      <div class="coin-row">
        💰 <strong>Amount:</strong>
        TSh ${escapeHTML(
          String(order.amount_tzs || "")
        )}
      </div>


      <div class="coin-row">
        📱 <strong>Payment Number:</strong>
        ${escapeHTML(
          order.payment_number || "0786538998"
        )}
      </div>


      <div class="coin-row">
        🧾 <strong>Payment Reference:</strong><br>
        ${escapeHTML(
          order.payment_reference || "Hakuna reference"
        )}
      </div>


      <div class="coin-row">
        📅 <strong>Date:</strong>
        ${order.created_at
          ? escapeHTML(
              new Date(order.created_at)
                .toLocaleString()
            )
          : ""
        }
      </div>


      <div class="coin-row">
        <strong>Status:</strong>
        <span class="status ${escapeHTML(statusClass)}">
          ${statusText}
        </span>
      </div>


      ${approveButton}

    `;


    container.appendChild(div);

  });

}


/* ========================================= */
/* APPROVE COIN ORDER */
/* ========================================= */

async function approveCoinOrder(orderId) {

  if (!orderId) {
    return;
  }


  const confirmApproval =
    confirm(
      "Una uhakika unataka ku-APPROVE order hii?\n\n" +
      "Coins zitaongezwa kwenye account ya mteja."
    );


  if (!confirmApproval) {
    return;
  }


  const message =
    document.getElementById("coinMessage");


  message.textContent =
    "⏳ Ina-approve payment...";


  const { data, error } =
    await supabaseClient.rpc(
      "approve_coin_order",
      {
        p_order_id: orderId
      }
    );


  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;
  }


  if (!data || data.success !== true) {

    message.textContent =
      "❌ Approval haikukamilika.";

    return;
  }


  message.textContent =
    "✅ Payment approved! " +
    data.coins_added +
    " coins zimeongezwa.";


  loadCoinOrders();

}


/* ========================================= */
/* IMAGE PREVIEW */
/* ========================================= */

function previewImage(event) {

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("preview");


  if (!file) {

    preview.style.display =
      "none";

    return;
  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

}


/* ========================================= */
/* UPLOAD IMAGE */
/* ========================================= */

async function uploadImage(file) {

  if (!file) {
    return null;
  }


  const extension =
    file.name.split(".").pop();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const filePath =
    "games/" + fileName;


  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("game-images")
      .upload(
        filePath,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


  if (uploadError) {
    throw uploadError;
  }


  const { data } =
    supabaseClient
      .storage
      .from("game-images")
      .getPublicUrl(
        filePath
      );


  return data.publicUrl;

}


/* ========================================= */
/* ADD GAME */
/* ========================================= */

async function addGame() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const platform =
    document
      .getElementById("platform")
      .value
      .trim();


  const size =
    document
      .getElementById("size")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value
      .trim();


  const download1 =
    document
      .getElementById("download_url_1")
      .value
      .trim();


  const download2 =
    document
      .getElementById("download_url_2")
      .value
      .trim();


  const download3 =
    document
      .getElementById("download_url_3")
      .value
      .trim();


  const imageFile =
    document
      .getElementById("imageFile")
      .files[0];


  const message =
    document
      .getElementById("message");


  /* LINK 1 NI LAZIMA */

  if (
    !name ||
    !platform ||
    !size ||
    !category ||
    !download1 ||
    !imageFile
  ) {

    message.textContent =
      "⚠️ Jaza taarifa zote, Download Link 1 na chagua picha.";

    return;
  }


  try {

    message.textContent =
      "⏳ Inapakia picha...";


    const imageUrl =
      await uploadImage(
        imageFile
      );


    message.textContent =
      "⏳ Inahifadhi game...";


    const { error } =
      await supabaseClient
        .from("games")
        .insert({

          name: name,

          platform: platform,

          size: size,

          category: category,

          image: imageUrl,

          /* OLD LINK */

          url: download1,

          /* NEW LINKS */

          download_url_1:
            download1,

          download_url_2:
            download2 || null,

          download_url_3:
            download3 || null

        });


    if (error) {
      throw error;
    }


    message.textContent =
      "✅ Game na download links vimeongezwa!";


    /* CLEAR FORM */

    document.getElementById("name").value =
      "";

    document.getElementById("platform").value =
      "";

    document.getElementById("size").value =
      "";

    document.getElementById("category").value =
      "";

    document.getElementById("download_url_1").value =
      "";

    document.getElementById("download_url_2").value =
      "";

    document.getElementById("download_url_3").value =
      "";

    document.getElementById("imageFile").value =
      "";


    document.getElementById("preview").style.display =
      "none";


    loadGames();


  } catch (error) {

    message.textContent =
      "❌ " + error.message;

  }

}


/* ========================================= */
/* LOAD GAMES */
/* ========================================= */

async function loadGames() {

  const container =
    document.getElementById("games");


  container.innerHTML =
    "⏳ Inapakia games...";


  const { data, error } =
    await supabaseClient
      .from("games")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    container.innerHTML =
      "❌ " +
      escapeHTML(error.message);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "Hakuna games bado.";

    return;
  }


  container.innerHTML =
    "";


  data.forEach(function(game) {

    const div =
      document.createElement("div");


    div.className =
      "game";


    let imageHTML =
      "";


    if (game.image) {

      imageHTML = `
        <img
          src="${escapeHTML(game.image)}"
          alt="Game image">
      `;

    }


    let linksHTML =
      "";


    if (game.download_url_1) {

      linksHTML += `
        <div>
          🔗 Download Link 1
        </div>
      `;

    }


    if (game.download_url_2) {

      linksHTML += `
        <div>
          🔗 Download Link 2
        </div>
      `;

    }


    if (game.download_url_3) {

      linksHTML += `
        <div>
          🔗 Download Link 3
        </div>
      `;

    }


    div.innerHTML = `

      ${imageHTML}


      <strong>
        🎮 ${escapeHTML(game.name)}
      </strong>


      <br><br>


      📱 Platform:
      ${escapeHTML(
        game.platform || ""
      )}


      <br>


      📦 Size:
      ${escapeHTML(
        game.size || ""
      )}


      <br>


      🗂️ Category:
      ${escapeHTML(
        game.category || ""
      )}


      <br><br>


      ${linksHTML}


      <br>


      <button
        class="delete"
        onclick="deleteGame(${game.id})">

        🗑️ DELETE

      </button>

    `;


    container.appendChild(div);

  });

}


/* ========================================= */
/* DELETE GAME */
/* ========================================= */

async function deleteGame(id) {

  if (
    !confirm(
      "Una uhakika unataka kufuta game hii?"
    )
  ) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("games")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ " +
      error.message
    );

    return;
  }


  alert(
    "✅ Game imefutwa."
  );


  loadGames();

}


/* ========================================= */
/* ESCAPE HTML */
/* ========================================= */

function escapeHTML(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value ?? "";


  return div.innerHTML;

}


/* ========================================= */
/* ESCAPE ATTRIBUTE */
/* ========================================= */

function escapeAttribute(value) {

  return String(
    value ?? ""
  )
  .replace(/\\/g, "\\\\")
  .replace(/'/g, "\\'");

}


/* ========================================= */
/* CHECK SESSION */
/* ========================================= */

async function checkSession() {

  const { data } =
    await supabaseClient
      .auth
      .getSession();


  if (data.session) {

    showPanel();

  }

}


checkSession();

</script>

</body>
</html>
