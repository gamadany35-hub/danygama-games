<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danygama Games - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: #141a27;
      padding: 25px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 9px;
      border: 1px solid #303a4e;
      font-size: 15px;
    }

    input {
      background: #20283a;
      color: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      background: #7658ff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #444;
    }

    .delete {
      background: #d62828;
    }

    .game {
      background: #20283a;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
    }

    .game img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    #panel {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    hr {
      border: 0;
      border-top: 1px solid #303a4e;
      margin: 25px 0;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎮 DANYGAMA GAMES</h1>

  <div id="login">

    <h2>🔐 Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">LOGIN</button>

    <p id="loginMessage" class="message"></p>

  </div>


  <div id="panel">

    <h2>👑 Admin Panel</h2>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

    <hr>

    <h2>➕ Add New Game</h2>

    <input
      id="name"
      type="text"
      placeholder="Game name"
    >

    <input
      id="platform"
      type="text"
      placeholder="Platform mfano Android"
    >

    <input
      id="size"
      type="text"
      placeholder="Size mfano 2 GB"
    >

    <input
      id="category"
      type="text"
      placeholder="Category mfano Football"
    >

    <label>
      🖼️ Chagua picha ya game:
    </label>

    <input
      id="imageFile"
      type="file"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img id="preview">

    <input
      id="url"
      type="url"
      placeholder="Download URL"
    >

    <button onclick="addGame()">
      💾 SAVE GAME
    </button>

    <p id="message" class="message"></p>

    <hr>

    <h2>🎮 Games Zilizopo</h2>

    <div id="games">
      Inapakia games...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://octyeeoameulsdlaaqbc.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jdHllZW9hbWV1bHNkbGFhcWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDE3MzQsImV4cCI6MjEwMzYxNzczNH0.fctDZE-PaC0SPOmygd_6sDEGqaLguNlWXx757MHTPAI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {
    message.textContent =
      "⚠️ Weka email na password.";
    return;
  }

  message.textContent =
    "⏳ Inaingia...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent =
      "❌ " + error.message;
    return;
  }

  message.textContent =
    "✅ Login successful!";

  showPanel();
}


function showPanel() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("panel").style.display =
    "block";

  loadGames();
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("panel").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";
}


function previewImage(event) {

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("preview");

  if (!file) {
    preview.style.display = "none";
    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";
}


async function uploadImage(file) {

  if (!file) {
    return null;
  }

  const extension =
    file.name.split(".").pop();

  const fileName =
    Date.now() + "-" +
    Math.random().toString(36).substring(2) +
    "." + extension;

  const filePath =
    "games/" + fileName;


  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("game-images")
      .upload(filePath, file, {
        cacheControl: "3600",
        upsert: false
      });


  if (uploadError) {
    throw uploadError;
  }


  const { data } =
    supabaseClient
      .storage
      .from("game-images")
      .getPublicUrl(filePath);


  return data.publicUrl;
}


async function addGame() {

  const name =
    document.getElementById("name").value.trim();

  const platform =
    document.getElementById("platform").value.trim();

  const size =
    document.getElementById("size").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const url =
       document.getElementById("url").value.trim();

  const imageFile =
    document.getElementById("imageFile").files[0];

  const message =
    document.getElementById("message");

  if (
    !name ||
    !platform ||
    !size ||
    !category ||
    !url ||
    !imageFile
  ) {
    message.textContent =
      "⚠️ Jaza taarifa zote na chagua picha.";
    return;
  }

  try {

    message.textContent =
      "⏳ Inapakia picha...";

    const imageUrl =
      await uploadImage(imageFile);

    message.textContent =
      "⏳ Inahifadhi game...";

    const { error } =
      await supabaseClient
        .from("games")
        .insert({
          name: name,
          platform: platform,
          size: size,
          category: category,
          image: imageUrl,
          url: url
        });

    if (error) {
      throw error;
    }

    message.textContent =
      "✅ Game na picha vimeongezwa!";

    document.getElementById("name").value = "";
    document.getElementById("platform").value = "";
    document.getElementById("size").value = "";
    document.getElementById("category").value = "";
    document.getElementById("url").value = "";
    document.getElementById("imageFile").value = "";

    document.getElementById("preview").style.display =
      "none";

    loadGames();

  } catch (error) {

    message.textContent =
      "❌ " + error.message;

  }
}


async function loadGames() {

  const container =
    document.getElementById("games");

  container.innerHTML =
    "⏳ Inapakia games...";

  const { data, error } =
    await supabaseClient
      .from("games")
      .select("*")
      .order("id", {
        ascending: false
      });

  if (error) {
    container.innerHTML =
      "❌ " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML =
      "Hakuna games bado.";
    return;
  }

  container.innerHTML = "";

  data.forEach(function(game) {

    const div =
      document.createElement("div");

    div.className =
      "game";

    let imageHTML = "";

    if (game.image) {
      imageHTML =
        `<img src="${escapeHTML(game.image)}" alt="Game image">`;
    }

    div.innerHTML = `
      ${imageHTML}

      <strong>
        🎮 ${escapeHTML(game.name)}
      </strong>

      <br><br>

      📱 Platform:
      ${escapeHTML(game.platform || "")}

      <br>

      📦 Size:
      ${escapeHTML(game.size || "")}

      <br>

      🗂️ Category:
      ${escapeHTML(game.category || "")}

      <br><br>

      <button
        class="delete"
        onclick="deleteGame(${game.id})">
        🗑️ DELETE
      </button>
    `;

    container.appendChild(div);

  });

}


async function deleteGame(id) {

  if (!confirm(
    "Una uhakika unataka kufuta game hii?"
  )) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("games")
      .delete()
      .eq("id", id);

  if (error) {
    alert("❌ " + error.message);
    return;
  }

  alert("✅ Game imefutwa.");

  loadGames();
}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {
    showPanel();
  }
}


checkSession();

</script>

</body>
</html>
