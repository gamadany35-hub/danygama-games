<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Danygama Games - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: #141a27;
      padding: 25px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 9px;
      border: 1px solid #303a4e;
      font-size: 15px;
    }

    input {
      background: #20283a;
      color: white;
    }

    button {
      background: #7658ff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #444;
    }

    .delete {
      background: #d62828;
    }

    .game {
      background: #20283a;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    #panel {
      display: none;
    }

    hr {
      border: 0;
      border-top: 1px solid #303a4e;
      margin: 25px 0;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎮 DANYGAMA GAMES</h1>

  <div id="login">

    <h2>🔐 Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">LOGIN</button>

    <p id="loginMessage" class="message"></p>

  </div>


  <div id="panel">

    <h2>👑 Admin Panel</h2>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

    <hr>

    <h2>➕ Add New Game</h2>

    <input
      id="name"
      type="text"
      placeholder="Game name"
    >

    <input
      id="platform"
      type="text"
      placeholder="Platform mfano Android"
    >

    <input
      id="size"
      type="text"
      placeholder="Size mfano 2 GB"
    >

    <input
      id="category"
      type="text"
      placeholder="Category mfano Football"
    >

    <input
      id="image"
      type="text"
      placeholder="Image URL"
    >

    <input
      id="url"
      type="text"
      placeholder="Download URL"
    >

    <button onclick="addGame()">
      💾 SAVE GAME
    </button>

    <p id="message" class="message"></p>

    <hr>

    <h2>🎮 Games Zilizopo</h2>

    <div id="games">
      Inapakia games...
    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE CONNECTION
  ========================= */

  const SUPABASE_URL =
    "https://octyeeoameulsdlaaqbc.supabase.co";

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jdHllZW9hbWV1bHNkbGFhcWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDE3MzQsImV4cCI6MjEwMzYxNzczNH0.fctDZE-PaC0SPOmygd_6sDEGqaLguNlWXx757MHTPAI";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "⚠️ Weka email na password.";

      return;
    }


    message.textContent =
      "⏳ Inaingia...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.textContent =
        "❌ " + error.message;

      return;
    }


    message.textContent =
      "✅ Login successful!";


    showPanel();

  }


  /* =========================
     SHOW ADMIN PANEL
  ========================= */

  function showPanel() {

    document.getElementById("login").style.display =
      "none";

    document.getElementById("panel").style.display =
      "block";

    loadGames();

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("panel").style.display =
      "none";

    document.getElementById("login").style.display =
      "block";

    document.getElementById("email").value =
      "";

    document.getElementById("password").value =
      "";

  }


  /* =========================
     ADD GAME
  ========================= */

  async function addGame() {

    const name =
      document.getElementById("name").value.trim();

    const platform =
      document.getElementById("platform").value.trim();

    const size =
      document.getElementById("size").value.trim();

    const category =
      document.getElementById("category").value.trim();

    const image =
      document.getElementById("image").value.trim();

    const url =
      document.getElementById("url").value.trim();


    const message =
      document.getElementById("message");


    if (!name || !platform || !size || !category || !url) {

      message.textContent =
        "⚠️ Jaza Game name, Platform, Size, Category na Download URL.";

      return;
    }


    message.textContent =
      "⏳ Inaongeza game...";


    const { error } =
      await supabaseClient
        .from("games")
        .insert({

          name: name,

          platform: platform,

          size: size,

          category: category,

          image: image,

          url: url

        });


    if (error) {

      message.textContent =
        "❌ " + error.message;

      return;
    }


    message.textContent =
      "✅ Game imeongezwa!";


    document.getElementById("name").value =
      "";

    document.getElementById("platform").value =
      "";

    document.getElementById("size").value =
      "";

    document.getElementById("category").value =
      "";

    document.getElementById("image").value =
      "";

    document.getElementById("url").value =
      "";


    loadGames();

  }


  /* =========================
     LOAD GAMES
  ========================= */

  async function loadGames() {

    const container =
      document.getElementById("games");


    container.innerHTML =
      "⏳ Inapakia games...";


    const { data, error } =
      await supabaseClient
        .from("games")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      container.innerHTML =
        "❌ " + error.message;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        "Hakuna games bado.";

      return;
    }


    container.innerHTML =
      "";


    data.forEach(function(game) {

      const div =
        document.createElement("div");


      div.className =
        "game";


      div.innerHTML = `

        <strong>
          🎮 ${escapeHTML(game.name)}
        </strong>

        <br><br>

        📱 Platform:
        ${escapeHTML(game.platform || "")}

        <br>

        📦 Size:
        ${escapeHTML(game.size || "")}

        <br>

        🗂️ Category:
        ${escapeHTML(game.category || "")}

        <br><br>

        <button
          class="delete"
          onclick="deleteGame(${game.id})"
        >
          🗑️ DELETE
        </button>

      `;


      container.appendChild(div);

    });

  }


  /* =========================
     DELETE GAME
  ========================= */

  async function deleteGame(id) {

    const confirmDelete =
      confirm(
        "Una uhakika unataka kufuta game hii?"
      );


    if (!confirmDelete) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("games")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "❌ " + error.message
      );

      return;
    }


    alert(
      "✅ Game imefutwa."
    );


    loadGames();

  }


  /* =========================
     SECURITY: DISPLAY TEXT
  ========================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  /* =========================
     CHECK EXISTING LOGIN
  ========================= */

  async function checkSession() {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      showPanel();

    }

  }


  checkSession();

</script>

</body>
</html>
